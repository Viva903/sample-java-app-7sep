name: AI Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: ai-security-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 1. Secret scanning of the working tree (catches things like the
      #    hardcoded API key / credential patterns before they merge).
      - name: Gitleaks secret scan
        continue-on-error: true
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git -f json -r /repo/gitleaks-report.json -v

      # 2. Dependency (SCA) scanning via Trivy's filesystem scan. (Not OWASP
      #    Dependency-Check: without an NVD API key its first run downloads
      #    the full ~387k-record NVD feed and can take 20-60+ minutes: it
      #    timed out the equivalent Jenkins stage in practice. Trivy ships
      #    its own prebuilt vulnerability DB, so this needs no API key.)
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs-report.json
          severity: CRITICAL,HIGH,MEDIUM

      # 3. Container image scanning of the image the pipeline actually ships
      #    (same Dockerfile used by Jenkinsfile.ecr/.ecs/.eks).
      - name: Build image for scanning
        run: docker build -t sample-java-app:pr-${{ github.event.pull_request.number }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        continue-on-error: true
        with:
          image-ref: sample-java-app:pr-${{ github.event.pull_request.number }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload raw scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            gitleaks-report.json
            trivy-fs-report.json
            trivy-report.json
          if-no-files-found: ignore
          retention-days: 14

      # 4. AI triage: turn three raw, noisy scanner outputs into one
      #    prioritized, plain-language PR comment.
      - name: Claude security triage
        uses: anthropics/claude-code-action@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Three security scanners just ran against this PR's code and its
            container image:
              - Gitleaks (secrets): ./gitleaks-report.json (may be absent if no findings)
              - Trivy filesystem scan (vulnerable dependencies): ./trivy-fs-report.json
              - Trivy image scan (container image CVEs): ./trivy-report.json

            Read whichever of these files exist. For each finding, judge real
            risk, not just raw severity: is the affected code/dependency/package
            actually reachable from this application's code, and is it exploitable
            in how this app uses it? Ignore build-time-only or clearly unreachable
            findings.

            Post one PR comment with:
            1. A short "must fix before merge" list (real secrets committed;
               reachable, exploitable HIGH/CRITICAL vulnerabilities).
            2. A "worth tracking, not blocking" list.
            3. A one-line note on anything you judged as noise/false-positive and why.

            If a report file is missing or empty, treat that scanner as "no findings"
            and say so briefly rather than erroring.
