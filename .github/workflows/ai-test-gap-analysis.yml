name: AI Test Gap Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: ai-test-gap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage-and-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests with JaCoCo
        run: mvn -B -ntp test
        # test failures should still let the workflow continue so Claude can
        # comment on them too; the existing surefire testFailureIgnore already
        # keeps this from failing the job.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Claude test-gap analysis
        uses: anthropics/claude-code-action@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A JaCoCo coverage report was just generated at
            target/site/jacoco/jacoco.xml (human-readable at
            target/site/jacoco/index.html), and JUnit results are under
            target/surefire-reports/.

            1. Diff this branch against origin/${{ github.base_ref }} for
               *.java files under src/main/java. For each changed or new
               public method, look up its line-coverage in jacoco.xml.
            2. List methods/branches with no test coverage, ranked by risk
               (methods with side effects, external I/O, or that look like
               they could throw/NPE first).
            3. For the top 3 highest-risk uncovered methods, draft a JUnit 5
               test (using spring-boot-starter-test, already a dependency) as
               a reference snippet. Do not modify or commit any files — only
               suggest.
            4. Post one PR comment with the coverage summary, the ranked gap
               list, and the suggested test snippets.

            If there are no changed Java files or coverage data is missing,
            post a short comment saying so instead of erroring.
