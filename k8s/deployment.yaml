apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube-java-demo
  labels:
    app: sonarqube-java-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sonarqube-java-demo
  template:
    metadata:
      labels:
        app: sonarqube-java-demo
    spec:
      containers:
        - name: sonarqube-java-demo
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
